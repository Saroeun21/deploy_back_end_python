services:
  - type: web
    name: tripos-backend
    runtime: docker
    plan: free
    dockerContext: ./tripOsBack/tripos-backend
    dockerfilePath: ./tripOsBack/tripos-backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
